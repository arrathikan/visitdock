name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scaffold:
    name: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate starter files and documentation links
        run: python scripts/check_scaffold.py

  detect:
    name: detect app manifests
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect app manifests
        id: paths
        shell: bash
        run: |
          if [ -f backend/pyproject.toml ]; then echo 'backend=true' >> "$GITHUB_OUTPUT"; else echo 'backend=false' >> "$GITHUB_OUTPUT"; fi
          if [ -f frontend/package.json ]; then echo 'frontend=true' >> "$GITHUB_OUTPUT"; else echo 'frontend=false' >> "$GITHUB_OUTPUT"; fi

  backend:
    name: backend tests and lint
    needs: [scaffold, detect]
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: visitdock_test
          POSTGRES_USER: visitdock
          POSTGRES_PASSWORD: visitdock_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visitdock -d visitdock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://visitdock:visitdock_ci_only@localhost:5432/visitdock_test
      APP_ENV: test
      CLINIC_TIMEZONE: UTC
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend and development dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e ".[dev]" --no-deps
      - name: Lint backend
        run: ruff check .
      - name: Test backend
        run: python -m pytest -q

  frontend:
    name: frontend lint types tests build and E2E
    needs: [scaffold, detect]
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: visitdock_test
          POSTGRES_USER: visitdock
          POSTGRES_PASSWORD: visitdock_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visitdock -d visitdock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://visitdock:visitdock_ci_only@localhost:5432/visitdock_test
      CLINIC_TIMEZONE: UTC
      NEXT_PUBLIC_CLINIC_TIMEZONE: UTC
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      CORS_ORIGINS: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install E2E API and browser
        run: |
          python -m pip install -r ../backend/requirements-dev.lock
          python -m pip install -e "../backend[dev]" --no-deps
          npx playwright install --with-deps chromium
      - name: Start real API and frontend
        run: |
          (cd ../backend && alembic upgrade head && uvicorn app.main:app --host 127.0.0.1 --port 8000) > /tmp/visitdock-api.log 2>&1 &
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/visitdock-ui.log 2>&1 &
          python - <<'PYREADY'
          import time, urllib.request
          for url in ["http://localhost:8000/health", "http://localhost:3000"]:
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=1)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit(f"Service did not start: {url}")
          PYREADY
      - name: Real PostgreSQL browser CRUD on desktop and mobile
        run: npm run test:e2e
